repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: privata
        name: privata (module privacy)
        # --methods is opt-in for users; Privata runs it on itself so the
        # check's false positives surface here first.
        entry: uv run privata . --methods
        language: system
        pass_filenames: false
        types_or: [python, pyi]

      - id: docs-pin
        name: docs pin (pre-commit rev is current)
        entry: uv run python scripts/check_docs_pin.py
        language: system
        pass_filenames: false
        files: ^(README\.md|docs/.*\.md|src/privata/_version\.py)$

      - id: mypy
        name: mypy (type checker)
        entry: uv run mypy src tests
        language: system
        types: [python]
        pass_filenames: false

      - id: ty
        name: ty (type checker)
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
